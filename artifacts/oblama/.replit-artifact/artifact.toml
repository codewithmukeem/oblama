kind = "mobile"
previewPath = "/"
title = "Oblama"
description = "A privacy-first mobile AI app for running open-source chat and image models locally on iOS and Android, with offline-first model downloads, chat history, and device-aware recommendations."
version = "1.0.0"
id = "artifacts/oblama"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22794

[services.development]
run = "pnpm --filter @workspace/oblama run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/oblama", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/oblama", "run", "serve" ]

[services.env]
PORT = "22794"
BASE_PATH = "/"
