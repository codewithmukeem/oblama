name: Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        working-directory: artifacts/oblama
        run: pnpm exec expo prebuild --platform android --no-install --non-interactive

      - name: Assemble debug APK
        working-directory: artifacts/oblama/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp artifacts/oblama/android/app/build/outputs/apk/debug/app-debug.apk Oblama-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oblama-android-preview
          path: Oblama-preview.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Oblama-preview.apk
          generate_release_notes: true