name: Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        working-directory: artifacts/oblama
        run: pnpm exec expo prebuild --platform android --no-install --non-interactive

      - name: Assemble debug APK
        working-directory: artifacts/oblama/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare versioned APK and release metadata
        id: release
        run: |
          version="$(node -p "require('./artifacts/oblama/app.json').expo.version")"
          version_code="$(node -p "require('./artifacts/oblama/app.json').expo.android.versionCode")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Release tag v${tag_version} does not match app version ${version}."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp artifacts/oblama/android/app/build/outputs/apk/debug/app-debug.apk "dist/Oblama-v${version}-debug.apk"
          cp artifacts/oblama/android/app/build/outputs/apk/debug/app-debug.apk dist/Oblama.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Oblama-android-preview
          path: dist/Oblama-v*-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Oblama v${{ steps.release.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Oblama v${{ steps.release.outputs.version }}

            Private, local AI chat for Android.

            - Android version code: `${{ steps.release.outputs.version_code }}`
            - Package: `com.codewithmukeem.oblama`
            - Build: unsigned debug APK for sideloading and testing

            Download `Oblama.apk` below for the stable direct-download URL.
          files: dist/Oblama.apk
          generate_release_notes: true